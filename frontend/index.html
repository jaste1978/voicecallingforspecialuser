    <title>SunoSathi — Hearing Helper</title>

  <body>
    <div id="root"></div>
    <script>
      // Kill pinch-zoom and double-tap-zoom so the app feels native, not like
      // a web page. iOS WKWebView ignores user-scalable=no, so we also block
      // WebKit gesture events and multi-finger touches here. Single-finger
      // scroll and taps still work (touch-action: pan-x pan-y in CSS).
      (function () {
        var stop = function (e) { e.preventDefault(); };
        // WebKit pinch gestures (iOS Safari / WKWebView)
        document.addEventListener('gesturestart', stop, { passive: false });
        document.addEventListener('gesturechange', stop, { passive: false });
        document.addEventListener('gestureend', stop, { passive: false });
        // Two-finger pinch on any platform
        document.addEventListener('touchmove', function (e) {
          if (e.touches && e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        // Double-tap to zoom
        var lastTouch = 0;
        document.addEventListener('touchend', function (e) {
          var now = Date.now();
          if (now - lastTouch <= 300) e.preventDefault();
          lastTouch = now;
        }, { passive: false });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
